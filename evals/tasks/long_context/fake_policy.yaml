# Broad exploration: the model reads every module before editing. Without
# compaction the history outgrows the context window.
steps:
  - tool: search_code
    args: {query: needs_reorder}
  - tool: read_file
    args: {path: inventory/catalog.py}
  - tool: read_file
    args: {path: inventory/stock.py}
  - tool: read_file
    args: {path: inventory/suppliers.py}
  - tool: read_file
    args: {path: inventory/thresholds.py}
  - tool: read_file
    args: {path: inventory/reorder.py}
  - tool: edit_file
    args:
      path: inventory/reorder.py
      old_text: "    return stock < threshold"
      new_text: "    return stock <= threshold"
  - tool: run_tests
  - tool: finish
    args: {summary: Reorder at the threshold too.}
