# The edit has a whitespace slip. Recoverable only if the error quotes the real line.
steps:
  - tool: search_code
    args: {query: def page_slice}
  - tool: read_file
    args: {path: shop/pagination.py}
  - tool: edit_file
    typo: true
    args:
      path: shop/pagination.py
      old_text: "    start = page * per_page"
      new_text: "    start = (page - 1) * per_page"
  - tool: run_tests
  - tool: finish
    args: {summary: Fixed the page offset.}
